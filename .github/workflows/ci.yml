name: Ryko CI — Medical Archive (v0.1.0)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  medical-archive:
    name: أرشيف MEDICAL-AI — 529 اختباراً + بواباته
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Archive tests
        run: make medical-tests
      - name: Archive safety gates (ذهبية + تكافؤ + عتبات)
        run: make medical-gates
