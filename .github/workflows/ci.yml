name: Ryko CI — Platform + Medical Archive (v0.2.0)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  platform:
    name: المنصة — سجل القطع + سلسلة التدقيق + الاختبارات
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit (غير مانع في P0)
        run: pip-audit -r requirements.txt || true

      - name: Piece Registry validation
        run: make registry-validate

      - name: Audit chain integrity
        run: make audit-verify

      - name: Platform tests
        run: make test

  medical-archive:
    name: أرشيف MEDICAL-AI — 529 اختباراً + بواباته
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Archive tests
        run: make medical-tests
      - name: Archive safety gates (ذهبية + تكافؤ + عتبات)
        run: make medical-gates
