name: Ryko CI — Arabic LM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Unit tests — tokenizer + model + serving
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,serve,dev]"

      - name: Local secret gate (ZYKO pattern, stdlib — before anything runs)
        run: python scripts/secret_scan.py --tree .

      # gitleaks-action@v2 replaced by a pinned direct run: the action's
      # hardcoded command cannot take --baseline-path, and the provenance
      # receipts carry sha256 digests that the generic-api-key rule
      # misreads as API keys (CI runs #58-#65).  The baseline suppresses
      # exactly those 5 accepted findings; any NEW secret still fails.
      # .gitleaks.toml documents the whole story and becomes effective
      # once gitleaks fixes extend-allowlist merging.
      - name: Secrets scan (gitleaks, baseline-pinned)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          mkdir -p /tmp/gitleaks && tar -xzf /tmp/gitleaks.tgz -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks detect --redact -v --exit-code=2 \
            --log-opts=-1 \
            --baseline-path gitleaks-baseline.json \
            --report-format sarif --report-path results.sarif

      - name: Knowledge Core receipt verification (offline)
        run: |
          pip install -e . --no-deps
          python -m ryko_lm.provenance verify data/knowledge/ryko.receipt.json
          python -m ryko_lm.knowledge stats --db data/knowledge/ryko.sqlite

      - name: Run test suite
        run: pytest -q

  smoke:
    name: End-to-end smoke — sample -> tokenizer -> train -> generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train]"

      - name: Full pipeline on the committed sample
        run: make train-smoke
