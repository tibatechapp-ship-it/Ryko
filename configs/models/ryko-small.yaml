# Ryko-Small — single consumer-GPU configuration (~52M parameters).
# Requires a CUDA GPU (tested on RTX 3090/4090 / A10G class); not trainable in CI.
name: ryko-small
model:
  vocab_size: 32768
  block_size: 512
  n_layer: 12
  n_head: 8
  n_kv_head: 4
  n_embd: 512
  ffn_hidden: 1408
  dropout: 0.0
  rope_theta: 10000.0
  tie_embeddings: true
train:
  batch_size: 32
  grad_accum: 2
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  total_steps: 50000
  eval_every: 500
  seed: 1337
